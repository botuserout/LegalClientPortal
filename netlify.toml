[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["supabaseBackend.js", "emailService.js"]

# Route API backend requests to the serverless function
[[redirects]]
  from = "/api/backend"
  to = "/.netlify/functions/backend"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
