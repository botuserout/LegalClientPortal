<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1325" />
  <title>Legal Sthal — Client & Admin Portal</title>
  
  <!-- Instant Theme Attribute to Prevent FOUC -->
  <script>
    try {
      var t = localStorage.getItem('legalsthal_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
  
  <!-- Google Fonts: Inter, Plus Jakarta Sans, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <!-- Critical Resource Hints & Preloads for Sub-3-Second Load -->
  <link rel="preload" href="css/main.css" as="style" />
  <link rel="preload" href="css/components.css" as="style" />
  <link rel="modulepreload" href="js/app.js" />

  <!-- Modular CSS Styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/toasts.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <div id="app-root">
    <!-- Initial splash rendered before js/app.js mounts in <50ms -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; background: #0b1325;">
      <div style="width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: #d4af37; animation: spin 0.8s linear infinite;"></div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 1.15rem; color: #f3e5ab; font-weight: 600; letter-spacing: 0.5px;">Legal Sthal</div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- Modular JavaScript Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
